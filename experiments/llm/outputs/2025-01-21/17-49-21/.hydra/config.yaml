experiment:
  name: additivity
  episodes: 100
  scorer_model: aesthetics
  vocab_size: 100
  vocabulary:
  - vocabulary_jan.txt
  domain: whole
feedback:
  name: numerical
  num_policies: 1.0
  num_components: 500
  lambda_reg: 1.0
  adaptive_estimation_frequency: 0
tester:
  _target_: components.tester.PreferenceTester
  params:
    N_test_prompts: 1000
    N_pairs_eval: 5000
    base_prompt: A plate with fruits
seed: 6
algorithm: random
cache_dir: ${oc.env:HOME}/.cache/huggingface/hub
horizon: 3
accuracy: 1.0e-12
dense_feedback: true
saver:
  _target_: components.saver.FileSaver
  params:
    path: results/additivity/rand-numerical-6.txt
    log: logs/additivity/rand-numerical-6.txt
