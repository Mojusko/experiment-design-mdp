experiment:
  name: feedback_comparison
  id_prefix: human-feedback
  episodes: 80
  vocab_size: 2500
  vocabulary:
  - vocabulary3/bases.txt
  - vocabulary3/ambient.txt
  - vocabulary3/style.txt
  - vocabulary3/composition.txt
  - vocabulary3/lighting.txt
  - vocabulary3/detail.txt
  scorer_model: null
embedder:
  _target_: experiments.llm.components.embedder.CLIPEmbedder
  model_id: openai/clip-vit-large-patch14
  normalize: true
  cache_dir: ${cache_dir}
feedback:
  name: multinomial
  num_policies: 4
  num_components: 2
  num_rounds: 35
  lambda: 0.01
  adaptive_estimation_frequency: 0
  adaptive_estimation_start: 0
  adaptive_design_frequency: 0
  pass_V: true
  lambda_sparsity: 0
  objective: A
  use_model_specific_lambda: false
seed: 1
verbose: false
cache_dir: ${oc.env:HOME}/.cache/huggingface/hub
accuracy: 1.0e-14
experiment_id: run-visits-feedback-dsn-mult-ep80-1
base_prompt: ''
include_base_prompt_in_first_tokens: false
num_benchmark_episodes: 10
benchmark_episode_spec: design:70-79
estimation_episode_spec: design:30-69
test_only: true
explore_only: false
algorithm: design
visits_path: human_feedback_visits/lam0.01_ep80/visits-feedback-dsn-mult-ep80-1.pkl
feedback_path: human_feedbacks/watercolor_gpt-4.1-mini-0.01-ep80.jsonl
estimator_path: null
results_dir: results/gpt-cv-design/watercolor_lambda0.01/fold70
override_results_dir: true
tester:
- _target_: components.tester.HumanFeedbackBenchmarkTester
  params: {}
savers:
- _target_: components.saver.LearnedEstimatorSaver
  params:
    filename: estimator.pt
- _target_: components.saver.MetricsSaver
  params:
    filename: metrics.json
- _target_: components.saver.ConfSaver
  params:
    filename: config_resolved.yaml
