hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - algorithm=random
    - visits_path=human_feedback_visits/lam0.01_ep80/visits-feedback-rand-mult-ep80-1.pkl
    - feedback_path=human_feedbacks/4.1-mini-lam0.01-ep80.jsonl
    - feedback.lambda=0.01
    - experiment.episodes=80
    - benchmark_episode_spec="design:50-79,random:50-79"
    - results_dir=results/human-feedback/4.1-mini-lam0.01-ep80/random
    - override_results_dir=true
    - experiment_id=run-visits-feedback-rand-mult-ep80-1
    - seed=1
  job:
    name: run_exp
    chdir: null
    override_dirname: algorithm=random,benchmark_episode_spec="design:50-79,random:50-79",experiment.episodes=80,experiment_id=run-visits-feedback-rand-mult-ep80-1,feedback.lambda=0.01,feedback_path=human_feedbacks/4.1-mini-lam0.01-ep80.jsonl,override_results_dir=true,results_dir=results/human-feedback/4.1-mini-lam0.01-ep80/random,seed=1,visits_path=human_feedback_visits/lam0.01_ep80/visits-feedback-rand-mult-ep80-1.pkl
    id: ???
    num: ???
    config_name: config_human_feedback
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/guy/eth/experiment-design-mdp/experiments/llm
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/guy/eth/experiment-design-mdp/experiments/llm/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/guy/eth/experiment-design-mdp/experiments/llm/outputs/2025-09-24/03-29-27
    choices:
      feedback: multinomial
      embedder: clip
      experiment: feedback_comparison
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
