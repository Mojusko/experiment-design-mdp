#    params:
#      filename: "visits.pkl"
  - _target_: components.saver.ConfSaver # Keep ConfSaver
    params:
      filename: "config_resolved.yaml"
#  - _target_: components.saver.ImageGenerationSaver # This is for test results, not visit inspection
#    params:
#      seed: "${seed}"
