# Configuration specifically for running test-only mode (inference)
# with a fixed base prompt and adjusted horizon/vocabulary.
defaults:
  - experiment: feedback_comparison # Inherit base experiment settings
  - feedback: multinomial # Default feedback type (can be overridden)
  - embedder: clip # Default embedder
  - _self_

seed: 1 # Default seed for testing (can be overridden)
verbose: false
# base_prompt: "A very long journey" # REMOVED - Use bases.txt now
#base_prompt: 'A man running in the field'
base_prompt: ''
include_base_prompt_in_first_tokens: false # Keep false as per request
handle_duplicate_action: true # If true, duplicate non-zero actions in a sequence are replaced by 0 (keeping one random instance)
algorithm: "design" # Default algorithm (can be overridden)
cache_dir: "${oc.env:HOME}/.cache/huggingface/hub"
# horizon: 4 # REMOVED - Determined by len(experiment.vocabulary)
accuracy: 1e-14
dense_feedback: true # Keep true? Or set false if not relevant for testing? Assuming keep.
results_dir: "results/dummy" # Base directory (usually overridden)
experiment_id: "" # Define top-level key

# --- Special Modes ---
test_only: true # This config is intended for test_only mode
explore_only: false

# --- Test-only Configuration ---
estimator_path: null # Must be provided via command line
visits_path: null # Not used in this mode
override_results_dir: false # Default

# --- Experiment Vocabulary Override ---
# Override the vocabulary inherited from feedback_comparison
# Use standard vocabulary including bases.txt
experiment:
  vocabulary:
    - 'vocabulary3/bases.txt'
    - 'vocabulary3/ambient.txt'
    - 'vocabulary3/style.txt'
    - 'vocabulary3/composition.txt'
    - 'vocabulary3/lighting.txt'
    - 'vocabulary3/detail.txt'
  episodes: null # Episodes are determined by loaded visits in test-only mode
  # Other experiment settings like name, id_prefix, vocab_size
  # are inherited from feedback_comparison.yaml unless overridden here.
  scorer_model: ['sunny', 'medieval', 'technological'] # Use all three models

# --- Testers (Enabled for Inference) ---
tester:
  - _target_: components.tester.PreferenceTester
    params:
      N_test_prompts: 1000
      N_pairs_eval: 5000
  - _target_: components.tester.CosineTester
    params: null
  #- _target_: components.tester.ImageGenerationTester
  #  params:
  #     take_best_worst_N: 4 # Default N
  #     prompt_ranking_model: "current_iteration_estimator" # Rank using the current model's estimator
  #     base_prompt: "An open door or gateway" # Or "A specific fixed base prompt for this tester"
  #     save_worst: false # Explicitly false, worst prompts are not processed
  #     beam_width: 20 # Increase beam width
  # - _target_: components.tester.HumanFeedbackBenchmarkTester
  #   params: {} # No specific params needed in YAML, uses cfg and passed objects

# --- Savers (Enabled for Inference Results) ---
savers:
  - _target_: components.saver.MetricsSaver
    params:
      filename: "metrics.json"
      # metrics_keys is removed to automatically save all metrics from enabled testers
      # (e.g., preference_error, cosine_error, benchmark_accuracy)
      # except those handled by other savers.
  - _target_: components.saver.ConfSaver
    params:
      filename: "config_resolved.yaml"
  #- _target_: components.saver.ImageGenerationSaver # Saves images and image_metrics.json
  #  params:
  #    take_best_worst_N: 4 # Match tester N
  #    base_prompt: "An open door or gateway" # Or specific base_prompt for saver's seed generation, defaults to "" if null
  #    # prompt_ranking_model: 'gt' # This parameter is unused by the saver; relying on tester's output.
  #    add_scores: ['prompt'] # Only process and display prompt scores.
  #    # score_images_with_model: 'gt' # Not used if add_scores does not include 'image'.
  #    secondary_gt_prompt_score_for_model: 'sunny' # Instructs saver to also score tester's prompts with 'sunny' GT model.
  #    save_worst: false # Explicitly false, worst images are not generated/saved
  #  - _target_: components.saver.LearnedEstimatorSaver # Save the estimator trained from visits
  #    params:
  #      filename: "estimator.pt"
  # VisitsSaver, ReadableVisitsSaver are not typically needed for this inference mode,
  # as visits are an input.
