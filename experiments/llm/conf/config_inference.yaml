# Configuration specifically for running test-only mode (inference)
# with a fixed base prompt and adjusted horizon/vocabulary.
defaults:
  - experiment: feedback_comparison # Inherit base experiment settings
  - feedback: multinomial # Default feedback type (can be overridden)
  - embedder: clip # Default embedder
  - _self_

seed: 1 # Default seed for testing (can be overridden)
verbose: false
# base_prompt: "A very long journey" # REMOVED - Use bases.txt now
base_prompt: ''
include_base_prompt_in_first_tokens: false # Keep false as per request
algorithm: "design" # Default algorithm (can be overridden)
cache_dir: "${oc.env:HOME}/.cache/huggingface/hub"
# horizon: 4 # REMOVED - Determined by len(experiment.vocabulary)
accuracy: 1e-14
dense_feedback: true # Keep true? Or set false if not relevant for testing? Assuming keep.
results_dir: "results/dummy" # Base directory (usually overridden)
experiment_id: "" # Define top-level key

# --- Special Modes ---
test_only: true # This config is intended for test_only mode
explore_only: false

# --- Test-only Configuration ---
estimator_path: null # Must be provided via command line
visits_path: null # Not used in this mode
override_results_dir: false # Default

# --- Experiment Vocabulary Override ---
# Override the vocabulary inherited from feedback_comparison
# Use standard vocabulary including bases.txt
experiment:
  vocabulary:
    - 'vocabulary2/bases.txt' # ADDED back for inference config
    - 'vocabulary2/mediums.txt'
    - 'vocabulary2/movements.txt'
    - 'vocabulary2/emotions.txt'
  # Other experiment settings like name, id_prefix, vocab_size, scorer_model
  # are inherited from feedback_comparison.yaml unless overridden here.

# --- Testers (Enabled for Inference) ---
tester:
  - _target_: components.tester.PreferenceTester
    params:
      N_test_prompts: 1000
      N_pairs_eval: 5000
  - _target_: components.tester.CosineTester
    params: null
  - _target_: components.tester.ImageGenerationTester
    params:
       take_best_worst_N: 8 # Default N
       use_estimator: true # Use the loaded estimator
       save_worst: false # Default is false

# --- Savers (Enabled for Inference Results) ---
savers:
  - _target_: components.saver.MetricsSaver
    params:
      filename: "metrics.json"
      # Explicitly list metrics to save from testers
      metrics_keys: ["preference_error", "cosine_error", "best_image_score", "worst_image_score", "avg_top_image_score"]
  - _target_: components.saver.ConfSaver
    params:
      filename: "config_resolved.yaml"
  - _target_: components.saver.ImageGenerationSaver
    params:
      take_best_worst_N: 8 # Match tester N
      add_image_score: false
      save_worst: false # Match tester setting
  # VisitsSaver, LearnedEstimatorSaver, ReadableVisitsSaver are not needed for inference testing.
