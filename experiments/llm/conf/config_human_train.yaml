# Configuration specifically for training an estimator from human feedback
defaults:
  - embedder: clip # Inherit default embedder settings
  - feedback: multinomial # Inherit multinomial feedback defaults
  - _self_

# --- Core Settings (Inherited or Default) ---
seed: 1 # Default seed for this mode (can be overridden)
verbose: false
cache_dir: "${oc.env:HOME}/.cache/huggingface/hub"
accuracy: 1e-14 # Needed for estimator initialization? Check if required.
experiment_id: "" # Define top-level key to allow overriding from Makefile
base_prompt: "" # Add base_prompt for LLMGrid initialization
include_base_prompt_in_first_tokens: false # Add for LLMGrid initialization

# --- Experiment Settings (Copied from feedback_comparison.yaml) ---
# Define experiment settings directly here instead of inheriting experiment/feedback_comparison
experiment:
  name: "human_feedback_train" # Specific name for this mode
  id_prefix: "train-human" # Specific prefix
  episodes: 1 # Not used in this mode, but required by some components? Set to minimal.
  vocab_size: 2000 # Needed for env init?
  vocabulary: # Needed for env init?
    - 'vocabulary2/bases.txt'
    - 'vocabulary2/mediums.txt'
    - 'vocabulary2/movements.txt'
    - 'vocabulary2/emotions.txt'
  scorer_model: null # Define key, but set to null as it's not used

# --- Mode Settings ---
test_only: true # This mode runs within the test_only logic
explore_only: false
algorithm: "design" # Required for some internal logic/naming, though not used for exploration
horizon: 4 # Required for env init

# --- Feedback Settings ---
# Feedback settings are now inherited from conf/feedback/multinomial.yaml via defaults list.
# Specific overrides can be added here if needed:
feedback:
  # Ensure we use the default lambda_est from multinomial.yaml, not model-specific ones
  use_model_specific_lambda: false

# --- Input Paths (Passed via command line) ---
visits_path: null # Must be provided via command line
feedback_path: null # Must be provided via command line
estimator_path: null # Explicitly null, we are training one

# --- Output Settings ---
results_dir: "results/dummy" # Base directory, will likely be overridden
override_results_dir: false # Default, can be overridden via command line if RESULTS_DIR is set

# --- Component Settings ---
# No testers needed for this mode
tester: null

# Only include savers needed to save the trained estimator and the config
savers:
  - _target_: components.saver.LearnedEstimatorSaver
    params:
      filename: "estimator.pt" # Output filename for the trained estimator
  - _target_: components.saver.ConfSaver
    params:
      filename: "config_resolved.yaml" # Save the resolved config used for training
