defaults:
  - config
  - override feedback: multinomial
  - override embedder: clip 
  - _self_ # Ensure debug-specific values override defaults correctly
feedback:
  num_rounds: 5
  num_components: 3
  adaptive_estimation_frequency: 0
  adaptive_estimation_start: 0
  adaptive_design_frequency: 0
experiment:
   scorer_model: ['sunny']
   episodes: 20
   vocab_size: 50
# Results directory for debug mode
results_dir: "results/debug"
algorithm: "design"

# Special Modes
test_only: false
explore_only: false # Enable explore-only mode
# Test-only mode specific configuration
estimator_path: null

# Explicitly override testers to be null in explore_only mode
# Re-enable testers for standard debug runs (not explore_only)
tester:
  - _target_: components.tester.PreferenceTester
    params:
      N_test_prompts: 100 # Smaller values for debug
      N_pairs_eval: 500
  - _target_: components.tester.CosineTester
    params: null
  - _target_: components.tester.ImageGenerationTester
    params:
      take_best_worst_N: 4 # Debug specific N
      prompt_ranking_model: 'sunny' # Match config.yaml
      # save_worst: false # Default is false

# Use a list of savers with debug settings
# Only VisitsSaver, VisitsImageSaver, ConfSaver are allowed in explore_only mode
savers:
  #- _target_: components.saver.MetricsSaver
  #  params:
  #    filename: "metrics.json"
  #  - _target_: components.saver.LearnedEstimatorSaver
  #    params:
  #      filename: "estimator.pt"
  - _target_: components.saver.VisitsSaver
    params:
      filename: "visits.pkl"

  - _target_: components.saver.ConfSaver
    params:
      filename: "config_resolved.yaml"
 
  - _target_: components.saver.ReadableVisitsSaver
    params:
      output_filename: "readable_visits_debug.txt"
      dense_feedback: ${dense_feedback} # Get from top-level config

  #  - _target_: components.saver.VisitsImageSaver
  #    _convert_: "partial" # Only convert direct parameters, not nested ones
  #    params:
  #      output_subdir: "visit_images_debug" # Specific subdir for debug images
  #      # image_size and num_inference_steps are now taken from image_generator defaults
  #      seed_per_prompt: true # Keep deterministic generation per prompt

  - _target_: components.saver.ImageGenerationSaver
    params:
      # seed: "${seed}" # Seed is handled internally by the saver
      take_best_worst_N: 4 # Debug specific N
      debug_mode: true # Keep debug mode true
      image_size: 32 # Keep small image size for debug
      num_inference_steps: 20 # Keep few inference steps for debug
      add_scores: ['prompt'] # Match config.yaml
      secondary_gt_prompt_score_for_model: 'sunny' # Match config.yaml
      # score_images_with_model: 'gt' # Not used if add_scores does not include 'image'.
      # prompt_ranking_model: 'gt' # This parameter is unused by the saver

