defaults:
  - config
  - override feedback: multinomial
  - override embedder: clip
  - _self_

# Keep debug fast and compatible with explore_only
feedback:
  num_rounds: 2
  num_components: 2
  adaptive_estimation_frequency: 0
  adaptive_estimation_start: 0
  adaptive_design_frequency: 0

experiment:
  scorer_model: null
  episodes: 10
  vocab_size: 50

results_dir: "results/debug"
algorithm: "design"

# Special Modes
test_only: false
explore_only: false
estimator_path: null

# No testers in debug base; scripts can override as needed
tester: []

# Minimal savers; explore_only-compatible
savers:
  - _target_: components.saver.VisitsSaver
    params:
      filename: "visits.pkl"
  - _target_: components.saver.ConfSaver
    params:
      filename: "config_resolved.yaml"
