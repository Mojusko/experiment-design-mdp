defaults:
  - config
  - override feedback: multinomial
feedback:
  num_rounds: 10
  num_components: 3
  adaptive_estimation_frequency: 0
  adaptive_estimation_start: 0
  adaptive_design_frequency: 25
experiment:
   episodes: 100
   vocab_size: 1000
  #scorer_model: "art"
tester:
  - _target_: components.tester.PreferenceTester
    params:
      N_test_prompts: 100
      N_pairs_eval: 500
  - _target_: components.tester.CosineTester
    params: null
saver:
  _target_: components.saver.FileSaver
  params:
    path: "results/dummy/dummy.txt" # Overwrite from Makefile

