defaults:
  - experiment: feedback_comparison
  - feedback: numerical
  - tester: default

seed: 12
algorithm: "greedy"
cache_dir: "${oc.env:HOME}/.cache/huggingface/hub"
horizon: 3
accuracy: 1e-12
dense_feedback: true

saver:
  _target_: components.saver.FileSaver
  params:
    path: "results/dummy/dummy.txt" # Overwrite from Makefile
    log: "log/dummy/dummy.txt" # Overwrite from Makefile
