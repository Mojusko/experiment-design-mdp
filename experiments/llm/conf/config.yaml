defaults:
  - experiment: feedback_comparison
  - feedback: numerical
  - embedder: clip # Add default embedder configuration
  - _self_ # Ensure this config's values override defaults if needed

seed: 12
verbose: false
base_prompt: 'A man drinking tea while sitting'
#base_prompt: ''
# normalize_CLIP: true # Removed, now part of embedder config
include_base_prompt_in_first_tokens: true
algorithm: "design"
cache_dir: "${oc.env:HOME}/.cache/huggingface/hub" # Default cache dir
horizon: 3
accuracy: 1e-14
dense_feedback: true
# Results directory path
results_dir: "results/dummy"
# Experiment identifier (can be overridden from Makefile)
experiment_id: ""


# --- Test-only mode configuration ---
test_only: false  # Set to true to run test-only mode
estimator_path: null  # Path to saved estimator file
override_results_dir: false  # If true, use results_dir instead of deriving from estimator_path
tester:
  - _target_: components.tester.PreferenceTester
    params:
      N_test_prompts: 1000
      N_pairs_eval: 5000
  - _target_: components.tester.CosineTester
    params: null
  #  - _target_: components.tester.ImageGenerationTester
  #    params:
  #      take_best_worst_N: 4
  #      use_estimator: true # Controls if ImageGenerationTester uses learned weights

# Embedder configuration is loaded via defaults list above.
# Specific embedder settings (like model_id, cache_dir) are in conf/embedder/*.yaml


# Default savers configuration
savers:
  - _target_: components.saver.MetricsSaver
    params:
      filename: "metrics.json"
      metrics_keys: ["preference_error", "cosine_error"]
  #  - _target_: components.saver.LearnedEstimatorSaver
  #    params:
  #      filename: "estimator.pt"
  - _target_: components.saver.VisitsSaver
    params:
      filename: "visits.pkl"
  - _target_: components.saver.ConfSaver
    params:
      filename: "config_resolved.yaml"
