defaults:
  - experiment: feedback_comparison
  - feedback: numerical
  - embedder: clip # Add default embedder configuration
  - _self_ # Ensure this config's values override defaults if needed

seed: 12 # Or keep a default like 1
verbose: false
base_prompt: '' # Keep empty for exploration using bases.txt
# normalize_CLIP: true # Removed, now part of embedder config
include_base_prompt_in_first_tokens: false # Keep false
algorithm: "design"
cache_dir: "${oc.env:HOME}/.cache/huggingface/hub" # Default cache dir
# horizon: 4 # REMOVED - Determined by len(experiment.vocabulary)
accuracy: 0.00000001
dense_feedback: true
#same_first_action_in_episode: true # If true, all policies use the same action at h=0 within an episode
same_first_action_in_episode: false # If true, all policies use the same action at h=0 within an episode
# Results directory path
results_dir: "results/dummy"
# Experiment identifier (can be overridden from Makefile)
experiment_id: ""


# --- Special Modes ---
test_only: false  # Set to true to run test-only mode (load estimator or visits, test, save)
explore_only: false # Set to true to run explore-only mode (explore, save visits/images)

# --- Test-only / Inspection mode specific configuration ---
estimator_path: null  # Path to saved estimator file for test_only mode
visits_path: null     # Path to saved visits file for inspection mode (test_only=true, estimator_path=null)
override_results_dir: false  # If true in test_only/inspection mode, use results_dir instead of deriving from path
tester: # Enabled for standard runs
  - _target_: components.tester.PreferenceTester
    params:
      N_test_prompts: 1000
      N_pairs_eval: 5000
  - _target_: components.tester.CosineTester
    params: null
  #  - _target_: components.tester.ImageGenerationTester # Enabled for testing estimators
  #    params:
  #       take_best_worst_N: 4 # Default N
  #       use_estimator: true # Use the loaded/trained estimator
       # save_worst: false # Default is false, uncomment to save worst too
  # VisitsTester removed

# Embedder configuration is loaded via defaults list above.
# Specific embedder settings (like model_id, cache_dir) are in conf/embedder/*.yaml

# Default savers configuration
savers:
  - _target_: components.saver.MetricsSaver # Enabled for standard runs
    params:
      filename: "metrics.json"
      metrics_keys: ["preference_error", "cosine_error"]
  - _target_: components.saver.LearnedEstimatorSaver # Enabled for standard runs
    params:
      filename: "estimator.pt"
  - _target_: components.saver.VisitsSaver # Enabled for standard runs
    params:
      filename: "visits.pkl"
  - _target_: components.saver.ConfSaver # Keep ConfSaver
    params:
      filename: "config_resolved.yaml"
  #  - _target_: components.saver.ImageGenerationSaver # Keep enabled if you want images generated during full run tests
  #    params:
  #      # seed: "${seed}" # Seed is handled internally by the saver/tester logic
  #      # base_prompt: "${base_prompt}" # Base prompt is available via env object
  #      take_best_worst_N: 4 # Match tester N
  #      # debug_mode: false
  #      # image_size: 512 # Uses default from image_generator
  #      # num_inference_steps: 100 # Uses default from image_generator
  #      add_image_score: true # Calculate image scores using the estimator
  #      save_worst: false # Default is false, set true to save worst N images/prompts
  - _target_: components.saver.ReadableVisitsSaver # Enabled for standard runs
    params:
      output_filename: "readable_visits.txt"
      # visits_path: ${visits_path} # visits_path is only relevant for inspection/human_train modes

#  - _target_: components.saver.VisitsImageSaver # Keep commented for standard runs (unless needed)
#    _convert_: "partial" # Only convert direct parameters, not nested ones
#    params:
#      output_subdir: "visit_images" # Standard output dir
#      # image_size and num_inference_steps are now taken from image_generator defaults
      #seed_per_prompt: true # Use deterministic generation per prompt
