defaults:
  - experiment: feedback_comparison
  - feedback: numerical

seed: 12
verbose: false
base_prompt: 'A man walking alone'
#base_prompt: ''
normalize_CLIP: true
include_base_prompt_in_first_tokens: true
algorithm: "design"
cache_dir: "${oc.env:HOME}/.cache/huggingface/hub"
horizon: 3
accuracy: 1e-14
dense_feedback: true
# Results directory path
results_dir: "results/dummy"
# Experiment identifier (can be overridden from Makefile)
experiment_id: ""
# Test-only mode configuration
test_only: false  # Set to true to run test-only mode
estimator_path: null  # Path to saved estimator file
override_results_dir: false  # If true, use results_dir instead of deriving from estimator_path
tester:
  - _target_: components.tester.PreferenceTester
    params:
      N_test_prompts: 1000
      N_pairs_eval: 5000
  - _target_: components.tester.CosineTester
    params: null
  - _target_: components.tester.ImageGenerationTester
    params:
      take_best_worst_N: 4
      use_estimator: true

# Default savers configuration
savers:
  - _target_: components.saver.MetricsSaver
    params:
      filename: "metrics.json"
      metrics_keys: ["preference_error", "cosine_error"]
  - _target_: components.saver.LearnedEstimatorSaver
    params:
      filename: "estimator.pt"
  - _target_: components.saver.VisitsSaver
    params:
      filename: "visits.pkl"
  - _target_: components.saver.ImageGenerationSaver
    params:
      seed: "${seed}"
      base_prompt: "${base_prompt}"  
      take_best_worst_N: 4
      debug_mode: false
      image_size: 512
      num_inference_steps: 100
      add_image_score: true
  
