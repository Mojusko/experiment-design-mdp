defaults:
  - experiment: feedback_comparison
  - feedback: numerical

seed: 12
#base_prompt: 'A man walking in paris'
base_prompt: ''
normalize_CLIP: true
algorithm: "greedy"
cache_dir: "${oc.env:HOME}/.cache/huggingface/hub"
horizon: 3
accuracy: 1e-12
dense_feedback: true
tester:
  - _target_: components.tester.PreferenceTester
    params:
      N_test_prompts: 1000
      N_pairs_eval: 5000
  - _target_: components.tester.CosineTester
    params: null
saver:
  _target_: components.saver.FileSaver
  params:
    path: "results/dummy/dummy.txt" # Overwrite from Makefile

