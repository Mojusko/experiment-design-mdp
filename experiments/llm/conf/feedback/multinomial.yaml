name: "multinomial"
num_policies: 4
num_components: 3
num_rounds: 8 #static
lambda_dsn: 1 # Default design lambda, used if use_model_specific_lambda is false
lambda_est: 1 # Default estimation lambda, used if use_model_specific_lambda is false (Set higher based on previous findings)
use_model_specific_lambda: true # Set to false to use the defaults above
adaptive_estimation_frequency: 0
adaptive_estimation_start: 0
#adaptive_design_frequency: 100 
adaptive_design_frequency: 0 
#pass_V: true
pass_V: false

# Keywords for C-optimal design. If null or empty, A-optimal design will be used.
# The code will embed each keyword and use the resulting vectors for C-optimal design.
# Example: ["old", "classic", "traditional", "eternal"]
C_design_keywords: [
  # Original Pairs (20)
  "modern", "ancient",
  "colorful", "monochromatic",
  "complex", "simple",
  "vibrant", "muted",
  "dynamic", "static",
  "natural", "urban",
  "detailed", "minimalist",
  "bright", "dark",
  "warm", "cool",
  "abstract", "realistic",
  # Added/Modified Keywords (~30)
  "impressionist", "photorealistic", # Art Movements / Realism
  "surreal", "geometric",           # Art Styles
  "stylized", "naturalistic",       # General Styles (Replaced Cubist/Expressionist)
  "painterly", "sketchy",           # Visual Texture
  "cartoonish", "graphic",          # Visual Styles (Replaced Pixelated with Graphic)
  "japanese", "african",            # Cultural Styles
  "celtic", "islamic",              # Cultural Styles
  "historical", "futuristic",       # Eras / Time Periods (Replaced Victorian)
  "ornate", "plain",                # Detail Level (Replaced Gothic/Baroque)
  "organic", "mechanical",          # Form/Origin (Replaced Steampunk/Cyberpunk)
  "whimsical", "melancholic",       # Moods / Atmospheres
  "serene", "dramatic",             # Moods / Atmospheres
  "retro", "vintage",               # Time / Style Feel
  "textured", "smooth",             # Surface Quality (Replaced Watercolor/Oil Painting)
  "sculptural", "linear"            # Form / Design Style (Replaced Graphic with Linear)
] # Total: 50 keywords
#C_design_keywords: null

# Model-specific parameters (moved from experiment config)
# These are used only if use_model_specific_lambda is true
model_specific_params:
  japanese-text:
    lambda_dsn: 1
    lambda_est: 1
  ancient-text:
    lambda_dsn: 1 # Example value
    lambda_est: 1 #num_policies=4 (Kept high based on previous findings)
  futuristic-text:
    lambda_dsn: 1
    lambda_est: 1
  asian-text:
    lambda_dsn: 1
    lambda_est: 1
