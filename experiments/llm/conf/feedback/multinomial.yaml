name: "multinomial"
#num_policies: 4
num_policies: 4
num_components: 2
num_rounds: 20 #static
#lambda: 100 
lambda: 100 
adaptive_estimation_frequency: 0
adaptive_estimation_start: 0
#adaptive_design_frequency: 100 
adaptive_design_frequency: 0 
#pass_V: true
pass_V: false
lambda_sparsity: 0 # Strength of the L2 sparsity regularizer on P(s,a)

# Objective for the design: "A" for A-optimal, "C" for C-optimal.
# If "C" is chosen, C_design_keywords must be provided.
objective: "A"

# C_design_keywords are no longer used.
# For C-optimal adaptive design, the C vector is derived from the estimator.
# Static C-optimal design is not supported as it would require a pre-defined C vector.
