name: "multinomial"
num_policies: 4
num_components: 2
num_rounds: 10 #static
lambda_dsn: 0.1 # Default design lambda, used if use_model_specific_lambda is false
lambda_est: 1000 # Default estimation lambda, used if use_model_specific_lambda is false (Set higher based on previous findings)
use_model_specific_lambda: true # Set to false to use the defaults above
adaptive_estimation_frequency: 0
adaptive_estimation_start: 0
#adaptive_design_frequency: 100 
adaptive_design_frequency: 0 
pass_V: true
#pass_V: false

# Keywords for C-optimal design. If null or empty, A-optimal design will be used.
# Example: ["old", "classic", "traditional", "eternal"]
C_design_keywords: ["beautiful", "interesting", "complex", "simple", "colorful", "monochrome", "vibrant", "muted", "dynamic", "static", "natural", "urban", "detailed", "minimalist", "bright", "dark", "warm", "cool", "textured", "smooth"]
#C_design_keywords: null

# Model-specific parameters (moved from experiment config)
# These are used only if use_model_specific_lambda is true
model_specific_params:
  japanese-text:
    lambda_dsn: 0.1 # Example value
    lambda_est: 200
  ancient-text:
    lambda_dsn: 0.1 # Example value
    lambda_est: 1000 #num_policies=4 (Kept high based on previous findings)
  japanese-image:
    lambda_dsn: 0.1 # Example value
    lambda_est: 100
  aesthetics:
    lambda_dsn: 0.1 # Example value
    lambda_est: 10
  random_combination:
    lambda_dsn: 0.1 # Example value
    lambda_est: 10
